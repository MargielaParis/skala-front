<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="사진과 브이로그를 채워 나갈 여행 앨범입니다.">
    <meta name="theme-color" content="#4f46e5">
    <title>나의 여행 앨범 | Kiyeon's Park</title>
    <link rel="stylesheet" href="css/trendy.css">
</head>

<body>
    <a class="skip-link" href="#main">본문 바로가기</a>

    <div class="container">

        <nav aria-label="이동 경로">
            <ol class="breadcrumb">
                <li><a href="index.html">홈</a></li>
                <li aria-current="page">여행 앨범</li>
            </ol>
        </nav>

        <header class="page-header">
            <p class="kicker">ALBUM</p>
            <hgroup>
                <h1>나의 여행 앨범</h1>
                <p>사진과 브이로그, 배경 음악을 앞으로 채워 나갈 공간입니다.</p>
            </hgroup>

            <section aria-labelledby="bgm-title" class="bgm" data-component="audio-player">
                <h2 id="bgm-title">앨범 배경 음악</h2>
                <p><small>배경 음악은 아직 준비 중입니다.</small></p>
                <audio controls preload="metadata">
                    <source src="" type="audio/mpeg">
                    이 브라우저는 오디오 재생을 지원하지 않습니다.
                </audio>
            </section>
        </header>

        <main id="main">

            <!-- ============ 사진 갤러리 ============ -->
            <section aria-labelledby="gallery-title">
                <p class="kicker">GALLERY</p>
                <h2 id="gallery-title">사진 갤러리</h2>

                <ul class="trip-grid-container" data-component="gallery">
                    <li>
                        <figure class="trip-card">
                            <img src="" width="400" height="200"
                                alt="여행 사진 준비 중" loading="lazy" decoding="async">
                            <figcaption>
                                <span class="trip-card__index">01</span>
                                <strong>사진 준비 중</strong>
                                <small>여행을 다녀오면 채울 예정입니다.</small>
                            </figcaption>
                        </figure>
                    </li>
                </ul>
            </section>

            <!-- ============ 브이로그 ============ -->
            <section aria-labelledby="vlog-title">
                <p class="kicker">VLOG</p>
                <h2 id="vlog-title">여행 브이로그</h2>

                <figure class="media-card" data-component="video-player">
                    <video width="400" height="225" controls playsinline preload="metadata">
                        <source src="" type="video/mp4">
                        이 브라우저는 비디오 재생을 지원하지 않습니다.
                    </video>
                    <figcaption>브이로그 영상은 준비 중입니다.</figcaption>
                </figure>
            </section>

        </main>

        <footer class="site-footer">
            <p><a href="index.html">&larr; 홈으로 돌아가기</a></p>
            <p><small>&copy; <time datetime="2026">2026</time> 기연 포트폴리오</small></p>
        </footer>

    </div>
</body>

</html>
